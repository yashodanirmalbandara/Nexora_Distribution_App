version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nexora_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nexora_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: nexora_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy  # Ensures DB is fully accepting TCP connections first

  frontend:
    build: ./frontend
    container_name: nexora_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  services:
  db:
    ports:
      - "5432:5432"