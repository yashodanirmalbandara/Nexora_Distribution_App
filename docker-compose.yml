services:
  db:
    image: postgres:15-alpine
    container_name: nexora_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nexora_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexora_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: nexora_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/nexora_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: nexora_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
